name: Update contribution snake

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/contribution-snake.yml'

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230d9488
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%232dd4bf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images to the output branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const branch = 'output';
            let parent;
            let baseTree;
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              parent = ref.object.sha;
              const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              baseTree = commit.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await Promise.all(['github-snake.svg', 'github-snake-dark.svg'].map(async (path) => ({
              path,
              mode: '100644',
              type: 'blob',
              content: await fs.readFile(`dist/${path}`, 'utf8'),
            })));
            const { data: nextTree } = await github.rest.git.createTree({
              owner, repo, tree, ...(baseTree ? { base_tree: baseTree } : {}),
            });
            if (nextTree.sha === baseTree) {
              core.info('Contribution images are already up to date.');
              return;
            }
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, message: 'Update contribution snake [skip ci]',
              tree: nextTree.sha, parents: parent ? [parent] : [],
            });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha });
            }
